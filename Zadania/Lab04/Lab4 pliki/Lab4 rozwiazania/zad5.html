<!doctype html>
<html lang="pl" data-bs-theme="">

<head>
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="css/bootstrap.css" rel="stylesheet">
</head>

<body>
    <div id="inne" class="container mt-5 mb-3">
        <div class="row d-flex justify-content-center">
            <div class="col-sm-12 col-md-6">
                <h2>Zapytanie o ofertę</h2>
                <form method="POST" action="zad6.php">
                    <div class="form-group mt-2 mb-3">
                        <label for="exampleFormControlInput1">Adres email</label>
                        <input name="email" type="email" class="form-control" id="exampleFormControlInput1"
                            placeholder="name@example.com" required>
                    </div>
                    <div class="form-group mb-3">
                        <label for="exampleFormSelect1">Rodzaj oferty</label>
                        <select name="offer_type" class="form-select" id="exampleFormControlSelect1">
                            <option value="indywidualna" selected>indywidualna</option>
                            <option value="grupowa">grupowa</option>
                            <option value="specjalna">specjalna</option>
                        </select>
                    </div>
                    <div class="form-group mb-3">
                        <label for="exampleFormControlBudget">Budżet</label>
                        <div class="input-group mb-3">
                            <input name="budget" type="number" min="0" placeholder="20000" step="any"
                                class="form-control" required>
                            <span class="input-group-text">PLN</span>
                        </div>
                    </div>
                    <div class="form-group mb-3">
                        <label for="exampleFormControlTextarea1">Komentarz</label>
                        <textarea name="comment" class="form-control" id="exampleFormControlTextarea1" rows="3"
                            required></textarea>
                    </div>
                    <div class="form-group mb-3 d-flex justify-content-center">
                        <button type="submit" class="btn btn-primary">Wyślij</button>
                    </div>
                </form>
            </div>
        </div>
        <script src="js/bootstrap.bundle.js"></script>
</body>

</html>
